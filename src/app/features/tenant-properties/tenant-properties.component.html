<div class="tenant-header" *ngIf="tenant">
    <div class="tenant-info-section">
        <img [src]="tenant.organizationLogo" class="tenant-logo" />
        <div>
            <h2 class="tenant-title">{{ tenant.organizationName }}</h2>
            <p class="tenant-subtext">Manage property specifications</p>
        </div>
    </div>

    <!-- DROPDOWN MOVED HERE -->
    <div class="property-dropdown dropdown" (click)="$event.stopPropagation()">
        <button class="property-dropdown-btn" (click)="toggleDropdown()">
            Select Properties
            <i class="fa-solid fa-angle-down" [class.open]="dropdownOpen"></i>
        </button>

        <div class="property-dropdown-menu" *ngIf="dropdownOpen">

            <input type="text" class="property-search" placeholder="Search properties..." [(ngModel)]="searchText" />

            <div class="property-dropdown-list">
                <ng-container *ngFor="let spec of generalSpecs">
                    <div class="property-dropdown-item"
                        *ngIf="!searchText || spec.specificationName.toLowerCase().includes(searchText.toLowerCase())"
                        [class.active]="selectedPropertyIds.includes(spec.id)" (click)="onPropertyToggle(spec.id)">
                        <span>{{ spec.specificationName }}</span>

                        <input type="checkbox" [checked]="selectedPropertyIds.includes(spec.id)"
                            (click)="$event.stopPropagation()" (change)="onPropertyToggle(spec.id)" />
                    </div>
                </ng-container>
            </div>

        </div>
    </div>
</div>

<main class="editor-panel" *ngIf="selectedProperties.length > 0">
    <h3 class="editor-title">Property Values</h3>

    <div class="editor-grid">

        <div class="editor-card" *ngFor="let property of selectedProperties">

            <label class="editor-label">{{ property.specificationName }}</label>

            <label *ngIf="isBool(property.specificationType)" class="switch">
                <input type="checkbox" [(ngModel)]="property.value" (change)="updateBooleanValue(property)" />
                <span class="slider"></span>
            </label>

            <input *ngIf="isNumeric(property.specificationType)" type="number" class="editor-input"
                [(ngModel)]="property.value" (focus)="recordInitialValue(property)"
                (blur)="updatePropertyValue(property)" />

            <input *ngIf="isDate(property.specificationType)" type="date" class="editor-input"
                [(ngModel)]="property.value" (focus)="recordInitialValue(property)"
                (blur)="updatePropertyValue(property)" />

            <input *ngIf="isText(property.specificationType)" type="text" class="editor-input"
                [(ngModel)]="property.value" (focus)="recordInitialValue(property)"
                (blur)="updatePropertyValue(property)" />

        </div>

    </div>
</main>

<div id="customToast" class="custom-toast delete-toast">
    <div class="toast-content">
        <p id="toastMessage"></p>
    </div>
</div>
