<ngx-spinner type="ball-scale-multiple"></ngx-spinner>

<div
  *ngIf="errorMessage"
  [ngClass]="{ 'fade-out': fadeSuccess }"
  class="alert alert-danger alert-dismissible fade show"
  role="alert"
>
  <i class="fas fa-exclamation-circle me-2"></i>

  {{ errorMessage }}
</div>

<div
  class="d-flex justify-content-center align-items-center"
  style="height: 100vh"
>
  <div class="login-container col-4">
    <header class="d-flex align-items-center justify-content-center mb-4">
      <div class="logo-container text-center">
        <img
          src="assets/Images/logo.png"
          alt="Cherrypick"
          class="cherry-logo"
        />
        <h1 class="login-head mt-3">Login</h1>
      </div>
    </header>
    <div class="login-container-form-main w-100">
         <div class="login-container-form w-100">
          <form
            #loginForm="ngForm"
            (ngSubmit)="loginForm.form.valid && onSubmit()"
          >
            <div class="form-group">
              <label class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                placeholder="Enter your email"
                name="username"
                required
                [(ngModel)]="loginData.Email"
                aria-label="Email address"
              />
            </div>

            <div class="form-group my-3">
              <label class="form-label">Password</label>
              <div class="position-relative">
                <input
                  [type]="showPassword ? 'text' : 'password'"
                  class="form-control"
                  placeholder="Enter your password"
                  name="password"
                  required
                  [(ngModel)]="loginData.Password"
                  aria-label="Password"
                  autocomplete="current-password"
                />
                <i
                  *ngIf="showPassword"
                  (click)="togglePassword()"
                  class="fa-regular fa-eye eye-icon"
                ></i>
                <i
                  *ngIf="!showPassword"
                  (click)="togglePassword()"
                  class="fa-regular fa-eye-slash eye-icon"
                ></i>
              </div>
            </div>

            <div
              class="d-flex align-items-center justify-content-end cursor mb-3"
              [routerLink]="['/ForgetPassword']"
            >
              <span class="ForgetPassword">Forget Password?</span>
            </div>

            <div class="text-center mt-3">
              <button
                class="btn login w-100"
                type="submit"
                [disabled]="!loginForm.form.valid"
              >
                Login
              </button>
            </div>
          </form>
        </div>
     </div>
  </div>
</div>
